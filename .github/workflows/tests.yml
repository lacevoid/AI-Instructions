name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    name: Instruction integrity
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/health-check.sh
        name: health-check

  distribution:
    runs-on: ubuntu-latest
    name: Distribution smoke test
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test setup-ai-rules.sh in a temp consumer dir
        run: |
          set -euo pipefail
          REPO="$(pwd)"
          TMP="$(mktemp -d)"
          mkdir -p "$TMP/laravel"
          cp laravel/ai-instructions.md "$TMP/laravel/"
          cp -r laravel/ai-instructions "$TMP/laravel/ai-instructions"
          cp setup-ai-rules.sh "$TMP/"
          cd "$TMP"
          ./setup-ai-rules.sh laravel >/dev/null
          for expected in \
            AGENTS.md CLAUDE.md GEMINI.md .cursorrules .windsurfrules \
            .continuerules .aider.conf.yml \
            .github/copilot-instructions.md \
            .cursor/rules/laravel-directives.mdc \
            .clinerules/laravel-directives.md \
            ai-instructions/master/ai-instructions.md \
            ai-instructions/01-governance.md; do
            test -e "$expected" || { echo "MISSING: $expected"; exit 1; }
          done
          printf '\n# CUSTOM\n' >> ai-instructions/master/ai-instructions.md
          ./setup-ai-rules.sh laravel >/dev/null
          grep -q 'CUSTOM' ai-instructions/master/ai-instructions.md
          # reset: buang custom master, master kembali identik template
          ./setup-ai-rules.sh reset laravel >/dev/null
          if grep -q 'CUSTOM' ai-instructions/master/ai-instructions.md; then
            echo "FAIL: reset harus membuang custom"; exit 1
          fi
          if ! cmp -s ai-instructions/master/ai-instructions.md laravel/ai-instructions.md; then
            echo "FAIL: master hasil reset != template"; exit 1
          fi
          # AGENTS.md (hasil distribusi dari master) harus sama dengan template
          if ! cmp -s AGENTS.md laravel/ai-instructions.md; then
            echo "FAIL: AGENTS.md setelah reset != template"; exit 1
          fi
          # wipe --force: semua artefak hilang
          ./setup-ai-rules.sh wipe --force >/dev/null
          for gone in \
            AGENTS.md CLAUDE.md GEMINI.md .cursorrules .windsurfrules \
            .continuerules .aider.conf.yml \
            .github/copilot-instructions.md \
            ai-instructions .cursor .clinerules; do
            test -e "$gone" && { echo "FAIL: $gone masih ada setelah wipe"; exit 1; }
          done

          # template manager: template milik konsumen (AINSTRUCT_HOME terisolasi)
          export AINSTRUCT_HOME="$TMP/ahome"
          # list: built-in laravel terlihat
          ./setup-ai-rules.sh template list | grep 'laravel' >/dev/null || { echo "FAIL: list tidak memuat laravel"; exit 1; }
          # clone built-in -> custom (customisasi wajib clone; built-in terproteksi)
          ./setup-ai-rules.sh template clone mylaravel laravel >/dev/null
          test -f "$AINSTRUCT_HOME/templates/mylaravel/ai-instructions.md" \
            || { echo "FAIL: clone tidak membuat template custom"; exit 1; }
          # path custom vs built-in (warn protected)
          ./setup-ai-rules.sh template path mylaravel | grep "$AINSTRUCT_HOME" >/dev/null \
            || { echo "FAIL: path custom salah"; exit 1; }
          # distribusi memakai template custom: marker konsumen muncul
          mkdir -p "$TMP/proj-custom"
          ( cd "$TMP/proj-custom" && "$TMP/setup-ai-rules.sh" mylaravel 2>&1 \
              | grep 'Template: custom konsumen' >/dev/null ) \
            || { echo "FAIL: distribusi tidak memakai template konsumen"; exit 1; }
          # built-in TERPROTEKSI: tidak bisa dihapus / di-update langsung
          ./setup-ai-rules.sh template delete laravel >/dev/null 2>&1 && { echo "FAIL: built-in terhapus"; exit 1; }
          ./setup-ai-rules.sh template update laravel >/dev/null 2>&1 && { echo "FAIL: built-in ter-update"; exit 1; }
          test -d "$REPO/laravel" || { echo "FAIL: built-in hilang"; exit 1; }
          # delete custom tanpa --force di non-interaktif ditolak
          ./setup-ai-rules.sh template delete mylaravel >/dev/null 2>&1 && { echo "FAIL: delete tanpa force"; exit 1; }
          # update custom dari built-in (--force)
          ./setup-ai-rules.sh template update mylaravel --from laravel --force >/dev/null
          diff -q "$AINSTRUCT_HOME/templates/mylaravel/ai-instructions.md" "$REPO/laravel/ai-instructions.md" >/dev/null \
            || { echo "FAIL: update custom tidak sinkron"; exit 1; }
          # create scaffold kosong
          ./setup-ai-rules.sh template create blank >/dev/null
          test -f "$AINSTRUCT_HOME/templates/blank/ai-instructions.md" \
            || { echo "FAIL: create tidak membuat scaffold"; exit 1; }
          # delete custom --force
          ./setup-ai-rules.sh template delete mylaravel --force >/dev/null
          test -e "$AINSTRUCT_HOME/templates/mylaravel" && { echo "FAIL: custom tidak terhapus"; exit 1; }

          # adapter: bin/ainstruct via symlink vendor/bin (composer / npx style)
          mkdir -p "$TMP/vendor/lace/ainstruct/bin" "$TMP/vendor/bin"
          cp "$REPO/setup-ai-rules.sh" "$TMP/vendor/lace/ainstruct/"
          cp "$REPO/bin/ainstruct" "$TMP/vendor/lace/ainstruct/bin/"
          cp -r "$REPO/laravel" "$TMP/vendor/lace/ainstruct/laravel"
          ln -s ../lace/ainstruct/bin/ainstruct "$TMP/vendor/bin/ainstruct"
          ( cd "$TMP" && ./vendor/bin/ainstruct laravel >/dev/null )
          test -f "$TMP/AGENTS.md" || { echo "FAIL: bin/ainstruct tidak mendistribusikan"; exit 1; }

          # adapter: install.sh (curl | sh) via tarball lokal
          mkdir -p "$TMP/curl"
          cp "$REPO/install.sh" "$TMP/curl/"
          # bentuk codeload (top-level dir) — realistis untuk curl|sh
          git -C "$REPO" archive --format=tar.gz --prefix=AI-Instructions-main/ -o "$TMP/curl/ainstruct.tar.gz" HEAD
          ( cd "$TMP/curl" && AINSTRUCT_CACHE="$TMP/curl/.cache" \
              AINSTRUCT_SOURCE_URL="file://$TMP/curl/ainstruct.tar.gz" \
              sh install.sh laravel >/dev/null )
          test -f "$TMP/curl/AGENTS.md" || { echo "FAIL: install.sh tidak mendistribusikan"; exit 1; }
          # run ulang memakai cache (tanpa unduh ulang; URL sengaja invalid)
          ( cd "$TMP/curl" && AINSTRUCT_CACHE="$TMP/curl/.cache" \
              AINSTRUCT_SOURCE_URL="file:///nonexistent" \
              sh install.sh reset laravel >/dev/null )
          test -f "$TMP/curl/AGENTS.md" || { echo "FAIL: cache re-run gagal"; exit 1; }
          # bentuk datar (git archive tanpa prefix) juga harus didukung
          rm -rf "$TMP/curl2"
          mkdir -p "$TMP/curl2"
          cp "$REPO/install.sh" "$TMP/curl2/"
          git -C "$REPO" archive --format=tar.gz -o "$TMP/curl2/ainstruct.tar.gz" HEAD
          ( cd "$TMP/curl2" && AINSTRUCT_CACHE="$TMP/curl2/.cache" \
              AINSTRUCT_SOURCE_URL="file://$TMP/curl2/ainstruct.tar.gz" \
              sh install.sh laravel >/dev/null )
          test -f "$TMP/curl2/AGENTS.md" || { echo "FAIL: install.sh (flat) tidak mendistribusikan"; exit 1; }

          echo "smoke test: PASS"