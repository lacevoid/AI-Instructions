name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    name: Instruction integrity
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/health-check.sh
        name: health-check